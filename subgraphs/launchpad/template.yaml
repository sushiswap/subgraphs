specVersion: 1.0.0
description: Canonical Sushi Launchpad registry and management activity
repository: https://github.com/sushiswap/subgraphs
schema:
  file: ./schema.graphql
dataSources:
  {{#launchpad.deployments}}
  - kind: ethereum/contract
    name: {{ name }}
    network: {{ network }}
    context:
      chainId:
        type: BigInt
        data: '{{ chainId }}'
    source:
      address: '{{ address }}'
      startBlock: {{ startBlock }}
      abi: SushiLaunchpad
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - Launchpad
        - Launch
        - PendingLaunch
        - QuoteTokenPriceFeed
        - CreatorTransfer
        - InitialBuy
        - FeeDistribution
        - ReserveWithdrawal
        - LaunchFeeWithdrawal
      abis:
        - name: SushiLaunchpad
          file: ./abis/SushiLaunchpad.json
        - name: LaunchToken
          file: ../v3/abis/ERC20.json
        - name: LaunchPool
          file: ../v3/abis/pool.json
      eventHandlers:
        - event: TokenLaunched(indexed address,indexed address,indexed address,address,int24,string,string,uint16,uint256,uint64,uint16)
          handler: handleTokenLaunched
        - event: PositionCreated(indexed address,indexed address,indexed uint256,int24,int24,uint256,uint256,uint128)
          handler: handlePositionCreated
        - event: InitialBuyExecuted(indexed address,indexed address,indexed address,address,address,uint256,uint256)
          handler: handleInitialBuyExecuted
        - event: CreatorTransferred(indexed address,indexed address,indexed address)
          handler: handleCreatorTransferred
        - event: SushiFeeBpsUpdated(indexed address,uint16,uint16)
          handler: handleSushiFeeBpsUpdated
        - event: DefaultSushiFeeBpsUpdated(uint16,uint16)
          handler: handleDefaultSushiFeeBpsUpdated
        - event: ProtocolReserveBpsUpdated(uint16,uint16)
          handler: handleProtocolReserveBpsUpdated
        - event: ProtocolRecipientUpdated(indexed address,indexed address)
          handler: handleProtocolRecipientUpdated
        - event: LaunchFeeUpdated(uint256,uint256)
          handler: handleLaunchFeeUpdated
        - event: LaunchFeesWithdrawn(indexed address,uint256)
          handler: handleLaunchFeesWithdrawn
        - event: FeesDistributed(indexed address,indexed address,indexed address,address,address,uint16,uint256,uint256,uint256,uint256,uint256,uint256)
          handler: handleFeesDistributed
        - event: ProtocolReserveWithdrawn(indexed address,indexed address,uint256)
          handler: handleProtocolReserveWithdrawn
        - event: QuoteTokenPriceFeedUpdated(indexed address,indexed address,indexed address)
          handler: handleQuoteTokenPriceFeedUpdated
  {{/launchpad.deployments}}
