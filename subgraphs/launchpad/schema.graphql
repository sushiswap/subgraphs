type Launchpad @entity {
  # Chain-scoped factory identity
  id: ID!
  chainId: BigInt!
  address: String!

  # Deployment configuration
  positionManager: String!
  initialFdvUsd: BigInt!

  # Factory-version launch invariants, initialized atomically on first launch.
  launchTokenDecimals: Int
  launchTokenTotalSupply: BigInt
  launchPoolFee: Int
  launchPoolTickSpacing: Int

  # Current protocol configuration
  protocolRecipient: String!
  launchFee: BigInt!
  defaultSushiFeeBps: Int!
  protocolReserveBps: Int!

  launches: [Launch!]! @derivedFrom(field: "launchpad")
  quoteTokenPriceFeeds: [QuoteTokenPriceFeed!]! @derivedFrom(field: "launchpad")
  launchFeeWithdrawals: [LaunchFeeWithdrawal!]! @derivedFrom(field: "launchpad")
}

# Canonical, complete current projection for one launched token and its one
# launch pool/position. Tokens may have other V3 pools; `pool` is only the
# immutable pool created by this launch.
type Launch @entity {
  id: ID!
  chainId: BigInt!
  launchpad: Launchpad!

  token: String!
  initialCreator: String!
  creator: String!
  quoteToken: String!
  pool: String!
  launchTokenIsToken0: Boolean!

  # Token identity emitted for this launch.
  name: String!
  symbol: String!

  # Factory-cached ERC-20 invariants initialized from the first launch.
  decimals: Int!
  totalSupply: BigInt!

  # Immutable launch pricing.
  initialFdvUsd: BigInt!
  startTick: Int!

  # Factory-cached V3 pool invariants initialized from the first launch.
  poolFee: Int!
  poolTickSpacing: Int!

  # The single launch position.
  positionManager: String!
  positionId: BigInt!
  tickLower: Int!
  tickUpper: Int!
  tokenDesired: BigInt!
  tokenUsed: BigInt!
  liquidity: BigInt!

  # Current fee and reserve state.
  sushiFeeBps: Int!
  reserveBps: Int!
  reserveAmount: BigInt!
  reserveUnlockAt: BigInt!
  reserveWithdrawn: Boolean!
  reserveWithdrawal: ReserveWithdrawal
  initialBuy: InitialBuy

  feeDistributions: [FeeDistribution!]! @derivedFrom(field: "launch")
  creatorTransfers: [CreatorTransfer!]! @derivedFrom(field: "launch")

  # TokenLaunched metadata, plus the completing PositionCreated log.
  creationTransactionHash: String!
  creationLogIndex: BigInt!
  positionCreationLogIndex: BigInt!
  creationBlockNumber: BigInt!
  creationBlockHash: String!
  createdAt: BigInt!
}

# Internal two-event accumulator. It is removed as soon as PositionCreated
# publishes the complete Launch, so canonical consumers never observe a launch
# without its required position.
type PendingLaunch @entity {
  id: ID!
  chainId: BigInt!
  launchpad: Launchpad!
  token: String!
  creator: String!
  quoteToken: String!
  pool: String!
  launchTokenIsToken0: Boolean!
  name: String!
  symbol: String!
  startTick: Int!
  sushiFeeBps: Int!
  reserveBps: Int!
  reserveAmount: BigInt!
  reserveUnlockAt: BigInt!
  creationTransactionHash: String!
  creationLogIndex: BigInt!
  creationBlockNumber: BigInt!
  creationBlockHash: String!
  createdAt: BigInt!
}

type QuoteTokenPriceFeed @entity {
  id: ID!
  chainId: BigInt!
  launchpad: Launchpad!
  quoteToken: String!
  priceFeed: String!
  updatedTransactionHash: String!
  updatedLogIndex: BigInt!
  updatedBlockNumber: BigInt!
  updatedBlockHash: String!
  updatedAt: BigInt!
}

type CreatorTransfer @entity(immutable: true) {
  id: ID!
  chainId: BigInt!
  launch: Launch!
  previousCreator: String!
  newCreator: String!
  transactionHash: String!
  logIndex: BigInt!
  blockNumber: BigInt!
  blockHash: String!
  timestamp: BigInt!
}

type InitialBuy @entity(immutable: true) {
  id: ID!
  chainId: BigInt!
  launch: Launch!
  creator: String!
  recipient: String!
  quoteToken: String!
  pool: String!
  amountIn: BigInt!
  amountOut: BigInt!
  transactionHash: String!
  logIndex: BigInt!
  blockNumber: BigInt!
  blockHash: String!
  timestamp: BigInt!
}

type FeeDistribution @entity(immutable: true) {
  id: ID!
  chainId: BigInt!
  launch: Launch!
  pool: String!
  caller: String!
  sushiRecipient: String!
  creatorRecipient: String!
  sushiFeeBps: Int!
  amount0Collected: BigInt!
  amount1Collected: BigInt!
  amount0ToSushi: BigInt!
  amount1ToSushi: BigInt!
  amount0ToCreator: BigInt!
  amount1ToCreator: BigInt!
  transactionHash: String!
  logIndex: BigInt!
  blockNumber: BigInt!
  blockHash: String!
  timestamp: BigInt!
}

type ReserveWithdrawal @entity(immutable: true) {
  id: ID!
  chainId: BigInt!
  launch: Launch!
  recipient: String!
  amount: BigInt!
  transactionHash: String!
  logIndex: BigInt!
  blockNumber: BigInt!
  blockHash: String!
  timestamp: BigInt!
}

type LaunchFeeWithdrawal @entity(immutable: true) {
  id: ID!
  chainId: BigInt!
  launchpad: Launchpad!
  recipient: String!
  amount: BigInt!
  transactionHash: String!
  logIndex: BigInt!
  blockNumber: BigInt!
  blockHash: String!
  timestamp: BigInt!
}
